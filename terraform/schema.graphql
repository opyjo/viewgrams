# GraphQL Schema for Mermaid Viewer

scalar AWSDateTime

type Diagram {
  id: ID!
  userId: ID!
  title: String!
  description: String
  code: String!
  svgPreview: String
  tags: [String!]
  projectId: String
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type DiagramConnection {
  items: [Diagram!]!
  nextToken: String
}

type Project {
  projectId: ID!
  userId: ID!
  name: String!
  description: String
  color: String
  diagramCount: Int!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type ProjectConnection {
  items: [Project!]!
  nextToken: String
}

input CreateProjectInput {
  name: String!
  description: String
  color: String
}

input UpdateProjectInput {
  projectId: ID!
  name: String
  description: String
  color: String
}

input CreateDiagramInput {
  title: String!
  description: String
  code: String!
  svgPreview: String
  tags: [String!]
  projectId: String
}

input UpdateDiagramInput {
  id: ID!
  title: String
  description: String
  code: String
  svgPreview: String
  tags: [String!]
  projectId: String
}

type Query {
  getDiagram(id: ID!): Diagram
  listDiagrams(limit: Int, nextToken: String, projectId: String): DiagramConnection!
  searchDiagrams(searchTerm: String!, projectId: String): [Diagram!]!
  getProject(projectId: ID!): Project
  listProjects(limit: Int, nextToken: String): ProjectConnection!
}

type Mutation {
  createDiagram(input: CreateDiagramInput!): Diagram!
  updateDiagram(input: UpdateDiagramInput!): Diagram
  deleteDiagram(id: ID!): Diagram
  createProject(input: CreateProjectInput!): Project!
  updateProject(input: UpdateProjectInput!): Project
  deleteProject(projectId: ID!): Project
  moveAllDiagramsToUncategorized(projectId: ID!): Int!
}

type Subscription {
  onCreateDiagram(userId: ID!): Diagram
    @aws_subscribe(mutations: ["createDiagram"])
  onUpdateDiagram(userId: ID!): Diagram
    @aws_subscribe(mutations: ["updateDiagram"])
  onDeleteDiagram(userId: ID!): Diagram
    @aws_subscribe(mutations: ["deleteDiagram"])
}
